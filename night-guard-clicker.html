<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Night Guard Clicker</title>
<style>
:root{--bg:#14102a;--p:#221a3f;--p2:#2e2455;--t:#f1e9d8;--m:#a79fc4;--a:#f5b73b;--r:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--t);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
body{background:var(--bg) repeating-conic-gradient(#ffffff08 0 25%,transparent 0 50%) 0 0/48px 48px}
.scr{display:none;min-height:100vh;padding:16px;position:relative}.scr.on{display:block}
button{font:inherit;color:var(--t);background:var(--p2);border:2px solid #4a3d80;border-radius:10px;padding:10px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--a)}button:disabled{opacity:.45;cursor:not-allowed}
#menu{text-align:center;padding-top:12vh;overflow:hidden}
h1{font-size:clamp(40px,10vw,84px);margin:0;letter-spacing:4px;color:var(--a);text-shadow:4px 4px 0 var(--r)}
.sub{color:var(--m);margin:8px 0 28px}.btns{display:flex;flex-direction:column;gap:12px;max-width:260px;margin:0 auto;position:relative;z-index:2}
.btns button{font-size:20px;padding:14px;background:var(--p)}
.sl{position:fixed;left:0;z-index:1;pointer-events:none;animation:sl var(--d) linear forwards}
.sl.rv{animation-name:slr}
@keyframes sl{from{transform:translateX(-250px)}to{transform:translateX(calc(100vw + 250px))}}
@keyframes slr{from{transform:translateX(calc(100vw + 250px)) scaleX(-1)}to{transform:translateX(-250px) scaleX(-1)}}
#game header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;background:var(--p);padding:10px 14px;border-radius:12px;border:2px solid #4a3d80}
#game header b{color:var(--a);font-size:22px}.st small{display:block;color:var(--m)}
#clock{flex:1;min-width:140px}#bar{height:8px;background:#0006;border-radius:4px;overflow:hidden;margin-top:4px}#bar i{display:block;height:100%;background:var(--a);width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
#stage{background:var(--p);border:2px solid #4a3d80;border-radius:12px;padding:12px;text-align:center;position:relative;overflow:hidden}
#hero{height:min(46vh,340px);max-width:100%;cursor:pointer;user-select:none;-webkit-user-drag:none;transition:transform .06s}#hero:active{transform:scale(.94) rotate(-2deg)}
#chars{display:flex;gap:8px;justify-content:center;margin:10px 0}#chars button{padding:4px;width:64px;height:64px}#chars button.on{border-color:var(--a)}#chars button.lk{filter:grayscale(1) brightness(.4)}#chars img{width:100%;height:100%;object-fit:contain}
#chars button.sec.lk{filter:none}#chars button.sec.lk img{filter:brightness(0)}
#perk,#tick{color:var(--m);font-size:14px;min-height:20px}
.fl{position:absolute;pointer-events:none;color:var(--a);font-weight:700;animation:fl .8s ease-out forwards}@keyframes fl{to{transform:translateY(-60px);opacity:0}}
#call{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--r);animation:rg .6s infinite alternate}@keyframes rg{to{transform:rotate(6deg)}}
#shop{background:var(--p);border:2px solid #4a3d80;border-radius:12px;padding:12px;max-height:78vh;overflow:auto}
#tabs{display:flex;gap:6px}.tab{flex:1;padding:6px}.tab.on{border-color:var(--a);background:var(--bg)}.tab.lk{opacity:.6}
#shop h3{margin:12px 0 8px}.it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:8px;align-items:center}
.it small{color:var(--m);grid-column:1}.it em{color:var(--a);font-style:normal;font-size:13px;grid-column:1}.it button{grid-row:1/4;grid-column:2}.it.own{opacity:.5}
.buy{width:100%}.lkm{color:var(--m)}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}#modal.on{display:flex}
.box{background:var(--p);border:3px solid var(--a);border-radius:14px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;text-align:center}
.box button{display:block;width:100%;margin-top:8px}.eimg{display:flex;justify-content:center;gap:6px}.eimg img{height:150px;max-width:19%;object-fit:contain}.m{color:var(--m)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:14px 0}.card{background:var(--p);border:2px solid #4a3d80;border-radius:12px;padding:12px;text-align:center}.card img{height:180px;max-width:100%;object-fit:contain}
.en{background:var(--p);border-radius:10px;padding:10px 14px;margin-bottom:8px}
#snd{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:6;padding:6px 10px}
</style></head><body>
<div id="menu" class="scr on"><h1>NIGHT GUARD</h1><p class="sub">Keep the animatronics running until 6 AM.</p>
<div class="btns"><button id="bNew">New Game</button><button id="bCont">Continue</button><button id="bExt">Extras</button></div><p class="sub" id="endCount"></p></div>
<div id="game" class="scr"><header><div class="st"><b id="tok">0</b><small>tokens</small></div><div class="st"><b id="cps">0</b><small>per second</small></div><div class="st"><b id="cpc">1</b><small>per click</small></div><div id="clock"><span id="clk"></span><div id="bar"><i></i></div></div><button id="bMenu">Menu</button></header>
<div class="cols"><div id="stage"><img id="hero" alt="Animatronic" draggable="false"><div id="chars"></div><div id="perk"></div><div id="tick"></div></div>
<div id="shop"><div id="tabs"></div><div id="list"></div></div></div></div>
<div id="extras" class="scr"><button id="bBack">Back</button><h2>Extras</h2><div class="gal" id="gal"></div><h2>Endings</h2><div id="ends"></div></div>
<button id="snd" title="Music on/off">🔊</button><button id="call" hidden>📞 Phone Guy is calling!</button><div id="modal"></div>

const U=[];RAW.forEach((r,t)=>r.forEach((s,i)=>{const[n,d,g]=s.split("|"),ty=TY[i],c=Math.round(B[t]*1.55**i);U.push({id:t*11+i,t,n,d,g,ty,c,v:ty=="a"?Math.max(1,Math.round(c/P)):ty=="c"?Math.max(1,Math.round(c/P/3)):0})}));

const $=id=>document.getElementById(id);let S=null,E={},tab=0,cur="menu",fin=0,callT=60,callOn=0,tk=0,last=Date.now();
const fmt=n=>{if(n<1e3)return n<10?n.toFixed(1).replace(/\.0$/,""):Math.floor(n)+"";const u=["K","M","B","T"];let i=-1;while(n>=1e3&&i<3){n/=1e3;i++}return n.toFixed(n<10?2:n<100?1:0)+u[i]};
const load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const fresh=()=>({t:0,tot:0,clicks:0,cc:0,tier:1,own:{},k:0,g:0,c:0,sel:"freddy"});
const show=id=>{document.querySelectorAll(".scr").forEach(e=>e.classList.toggle("on",e.id==id));cur=id};

function menu(){S=null;show("menu");const n=Object.keys(E).length;$("bExt").disabled=!n;$("bExt").textContent=n?"Extras":"Extras (finish an ending)";$("bCont").disabled=!load(KEY);$("endCount").textContent="Endings found: "+n+"/5"}
function calc(){let c=1,a=0,m=1;for(const u of U)if(S.own[u.id]){if(u.ty=="c")c+=u.v;else if(u.ty=="a")a+=u.v;else m*=1.25}if(S.sel=="freddy")a*=1.1;if(S.sel=="chica")c*=1.25;if(S.sel=="golden"){a*=1.2;c*=1.2}return{cpc:c*m,cps:a*m}}
const gain=v=>{S.t+=v;S.tot+=v};
function start(s){S=s;fin=0;if(S.tier>=5){GF=1;store("ng_gf",1)}tab=S.tier-1;show("game");$("hero").src=IMG[S.sel];buildShop();buildChars();upd()}
function buildChars(){const b=$("chars");b.innerHTML="";CH.forEach(c=>{const x=document.createElement("button"),ok=c.t<=S.tier;x.className=(c.id==S.sel?"on ":"")+(ok?"":"lk")+(c.id=="golden"?" sec":"");x.title=ok?c.n+": "+c.p:(c.id=="golden"?"???":"Unlocks at "+TN[c.t-1]);x.innerHTML='<img src="'+IMG[c.id]+'" alt="'+(ok||c.id!="golden"?c.n:"???")+'">';x.onclick=()=>{if(!ok)return;S.sel=c.id;$("hero").src=IMG[c.id];buildChars()};b.append(x)});const c=CH.find(c=>c.id==S.sel);$("perk").textContent=c.n+": "+c.p}
function buildShop(){const tb=$("tabs");tb.innerHTML="";TN.forEach((n,t)=>{const b=document.createElement("button");b.textContent=["I","II","III","IV","V"][t];b.className="tab"+(t==tab?" on":"")+(t>=S.tier?" lk":"");b.onclick=()=>{tab=t;buildShop()};tb.append(b)});

if(tab>=S.tier){const p=document.createElement("p");p.className="lkm";p.textContent=tab==S.tier?"Locked. Earn enough tokens to get clearance:":"Unlock the earlier tiers first.";l.append(p);if(tab==S.tier){const b=document.createElement("button");b.className="buy";b.id="uc";b.onclick=unlock;l.append(b)}upd();return}

function endKey(){if(S.clicks<1500)return"quiet";return S.k>=S.g&&S.k>=S.c?"good":S.g>=S.c?"greed":"chaos"}
function finish(){fin=1;const k=endKey();E[k]=1;store(EK,E);try{localStorage.removeItem(KEY)}catch(e){}showEnd(k)}
function showEnd(k){const e=EN[k],im=k=="all"||k=="secret"?Object.values(IMG).map(s=>'<img src="'+s+'">').join(""):'<img src="'+IMG[e[2]]+'">',sec=k!="secret"&&["good","greed","chaos","quiet"].every(x=>E[x]);
const m=modal('<div class="eimg">'+im+"</div><h2>Ending: "+e[0]+"</h2><p>"+e[1]+'</p><p class="m">Endings found: '+Object.keys(E).length+"/5</p>"+(sec?'<button id="sk">Open the Back Room</button>':"")+'<button id="eb">Back to Menu</button>');$("eb").onclick=()=>{hide();menu()};if(sec)$("sk").onclick=()=>{E.secret=1;store(EK,E);showEnd("secret")}}
function extras(){show("extras");$("gal").innerHTML=CH.map(c=>{const h=c.id=="golden"&&!GF;return'<div class="card"><img src="'+IMG[c.id]+'" alt="'+(h?"???":c.n)+'"'+(h?' style="filter:brightness(0)"':"")+"><h3>"+(h?"???":c.n)+"</h3><p class='m'>"+(h?"Reach the final tier to find out.":c.l)+"</p></div>"}).join("");$("ends").innerHTML=Object.keys(EN).map(k=>'<div class="en">'+(E[k]?"<b>"+EN[k][0]+"</b><br>"+EN[k][1]:"<b>???</b><br><span class='m'>Hint: "+EN[k][3]+"</span>")+"</div>").join("")}
$("bNew").onclick=()=>{if(load(KEY)&&!confirm("Start over? Your current night is lost. Unlocked endings stay."))return;start(fresh())};
$("bCont").onclick=()=>{const s=load(KEY);if(s)start(s)};$("bExt").onclick=extras;$("bBack").onclick=menu;$("bMenu").onclick=()=>{save();menu()};
setInterval(()=>{const now=Date.now(),dt=Math.min((now-last)/1000,5);last=now;if(cur!="game"||!S||fin)return;gain(calc().cps*dt);if(callOn>0){callOn-=dt;if(callOn<=0)$("call").hidden=true}else{callT-=dt;if(callT<=0){$("call").hidden=false;callOn=12;callT=70+Math.random()*60}}tk-=dt;if(tk<=0){tk=14;$("tick").textContent=MSG[Math.floor(Math.random()*MSG.length)]}upd();if(S.tot>=GOAL)finish()},100);
setInterval(()=>{if(cur=="game"&&!fin)save()},5000);
function spawn(){if(cur=="menu"){const i=document.createElement("img"),k=Object.keys(IMG),rv=Math.random()<.5;const kk=k[Math.floor(Math.random()*5)];i.src=IMG[kk];if(kk=="golden"&&!GF)i.style.filter="brightness(0)";i.className="sl"+(rv?" rv":"");i.style.top=(8+Math.random()*60)+"vh";i.style.height=(80+Math.random()*80)+"px";i.style.setProperty("--d",(9+Math.random()*6)+"s");i.onanimationend=()=>i.remove();document.body.append(i)}setTimeout(spawn,2500+Math.random()*3500)}
let GF=load("ng_gf")===1;let AC,mg,mute=load("ng_mute")===1,stp=0,nt=0;const NF=n=>440*2**((n-69)/12);
const LEAD=[69,0,72,0,76,0,72,0,74,0,77,0,74,0,72,0,69,0,72,0,76,0,79,0,77,0,76,0,72,0,71,0],BASS=[45,41,48,43];
function tone(f,t,d,ty,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}
function sched(){if(AC.state!="running")return;while(nt<AC.currentTime+.3){const s=stp%32;if(LEAD[s])tone(NF(LEAD[s]),nt,.2,"square",.05);if(s%2==0)tone(NF(BASS[Math.floor(s/8)]),nt,.24,"triangle",.14);if(s%4==2)tone(6000,nt,.03,"square",.015);stp++;nt+=.22}}
function music(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=mute?0:.6;mg.connect(AC.destination);nt=AC.currentTime+.1;setInterval(sched,100)}catch(e){return}}if(AC.state=="suspended")AC.resume();nt=Math.max(nt,AC.currentTime)}
document.addEventListener("pointerdown",music);$("snd").textContent=mute?"🔇":"🔊";
$("snd").onclick=()=>{mute=!mute;$("snd").textContent=mute?"🔇":"🔊";if(mg)mg.gain.value=mute?0:.6;store("ng_mute",mute?1:0)};
E=load(EK)||{};menu();spawn();
</script></body></html>
